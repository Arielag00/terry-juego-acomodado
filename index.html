<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <title>Terry - Juego</title>

    <style>
      /* =========================================
         LOADER SIMPLE DE TERRY
         ========================================= */

      #game-loader {
        position: fixed;
        inset: 0;
        z-index: 999999;

        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;

        background: #081f18;
        color: #ffffff;

        font-family: Arial, Helvetica, sans-serif;
        font-size: 15px;
        font-weight: 700;

        opacity: 1;
        visibility: visible;
        pointer-events: auto;

        transition:
          opacity 0.25s ease,
          visibility 0.25s ease;
      }

      #game-loader.loader-hidden {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }

      #game-loader .loader-spinner {
        width: 38px;
        height: 38px;

        border: 4px solid rgba(255, 255, 255, 0.16);
        border-top-color: #f59b23;
        border-radius: 50%;

        animation: terry-loader-spin 0.75s linear infinite;
      }

      @keyframes terry-loader-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>

  <body>
    <div
      id="game-loader"
      aria-live="polite"
      aria-label="Cargando juego"
    >
      <div
        class="loader-spinner"
        aria-hidden="true"
      ></div>

      <span>Cargando...</span>
    </div>

    <div id="app"></div>

    <script
      type="module"
      src="/src/main.ts"
    ></script>
  </body>
</html>
